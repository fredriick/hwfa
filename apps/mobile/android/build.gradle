buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        // Processes google-services.json into Firebase config resources (FCM push).
        classpath("com.google.gms:google-services:4.4.2")
    }
}

apply plugin: "com.facebook.react.rootproject"

// The react-native-webrtc AAR (org.jitsi:webrtc) is large and this machine
// corrupts big HTTPS downloads. It's fetched once, sha1-verified, into a local
// Maven repo (android/local-maven); route that group there exclusively so
// Gradle uses the verified file instead of re-downloading from Central.
allprojects {
    repositories {
        exclusiveContent {
            forRepository {
                maven { url = uri("${rootDir}/local-maven") }
            }
            filter { includeGroup("org.jitsi") }
        }
    }
}
